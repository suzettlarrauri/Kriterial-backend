# Servicios locales de desarrollo. Puertos no estándar para no chocar con
# instalaciones locales de PostgreSQL/Redis.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kriterial
      POSTGRES_PASSWORD: kriterial_dev
      POSTGRES_DB: kriterial
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kriterial -d kriterial']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
